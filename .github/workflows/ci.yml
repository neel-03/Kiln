name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify modules
        run: |
          go mod verify
          go -C tools mod verify

      - name: Build
        run: |
          go build -o /dev/null ./...
          go -C tools build -o /dev/null ./...

      - name: Test (unit only, no docker/network)
        run: |
          go test -race -count=1 -short ./...
          go -C tools test -race -count=1 -short ./...

      - name: Upload coverage
        if: matrix.go-version == '1.26'
        run: |
          go test -short -coverprofile=coverage.out ./...
          go -C tools test -short -coverprofile=coverage.out ./...

  lint-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  lint-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint (tools)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: tools
          args: --timeout=5m

  integration:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Run integration tests
        run: go test -race -count=1 -run Integration -tags=integration ./...
