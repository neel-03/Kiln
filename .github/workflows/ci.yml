name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify modules
        run: |
          go mod verify
          cd tools && go mod verify

      - name: Build
        run: |
          go build ./...
          cd tools && go build ./...

      - name: Test (unit only, no docker/network)
        run: |
          go test -race -count=1 -short ./...
          cd tools && go test -race -count=1 -short ./...

      - name: Upload coverage
        if: matrix.go-version == '1.26'
        run: go test -short -coverprofile=coverage.out ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: golangci-lint (tools)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: tools
          args: --timeout=5m

  integration:
    runs-on: ubuntu-latest
    # Integration tests actually run docker compose against example projects
    # (Section 14 of the design doc) — slower, so kept as a separate gated job
    # rather than blocking the fast unit-test feedback loop above.
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Run integration tests
        run: go test -race -count=1 -run Integration -tags=integration ./...
