# Pre-commit hook configuration.

default_language_version:
  golang: system

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^kiln\.yaml$
      - id: check-json
        exclude: \.vscode/.*\.json$

  # --- Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- YAML lint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict, -c=.yamllint.yaml]

  # --- Toolchain hooks
  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt
        entry: >-
          bash -c 'out="$(gofmt -l -s "$@")"; if [ -n "$out" ]; then
          echo "$out"; echo "Not gofmt-formatted -- run gofmt -s -w on the files above"; exit 1;
          fi' --
        language: system
        types: [go]

      - id: go-mod-tidy
        name: go mod tidy check
        entry: go mod tidy -diff
        language: system
        files: ^go\.(mod|sum)$
        pass_filenames: false

      - id: go-test-short
        name: go test -short (pre-push)
        entry: bash -c 'go test -short -count=1 ./...'
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

  # --- Linter
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint

  # --- Commit message format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
